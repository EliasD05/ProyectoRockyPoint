{% extends 'base.html' %}

{% block content %}
<div class="container fade-in" style="max-width: 600px;">
    <div class="glass-card">
        <h2 style="text-align: center;">Alta de Nuevos Usuarios</h2>
        <p style="text-align: center; color: var(--gray); margin-bottom: 3rem;">Panel Administrativo Rocky Point</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre_completo">Nombre Completo</label>
                <input type="text" name="nombre_completo" id="nombre_completo" value="{{ nombre_completo_prefill }}" required>
            </div>

            <div class="form-group">
                <label for="username">Nombre de Usuario (Login)</label>
                <input type="text" name="username" id="username" value="{{ request.GET.user }}" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña Temporal</label>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="role">Rol del Usuario</label>
                <select name="role" id="role">
                    <option value="normal">Socio Normal</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            
            {% if request.GET.from_solicitud %}
                <input type="hidden" name="from_solicitud" value="{{ request.GET.from_solicitud }}">
            {% endif %}
            
            <button type="submit" class="btn-login" style="width: 100%; margin-top: 2rem; padding: 1rem;">Crear Cuenta</button>
        </form>
    </div>
</div>
{% endblock %}
